[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedsmith"
version = "1.1.1"
description = "Generic self-hosted RSS and Atom publisher for public web metadata"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.34,<2",
  "requests>=2.31,<3",
]

[project.scripts]
feedsmith = "feedsmith.cli:main"

[tool.setuptools]
packages = ["feedsmith", "feedsmith.core", "feedsmith.migrations", "feedsmith.sources"]

[tool.setuptools.package-data]
feedsmith = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
