[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-rss"
version = "1.0.3"
description = "Self-hosted RSS and Atom feed publisher for Omni.se"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.34,<2",
  "requests>=2.31,<3",
]

[project.scripts]
omni-rss = "omni_rss.cli:main"

[tool.setuptools]
packages = ["omni_rss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
